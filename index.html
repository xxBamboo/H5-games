<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>我的眼镜在哪里？</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1a1a2e; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #game { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 14px 18px;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none; z-index: 10;
    font-weight: 700; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  #timer {
    background: rgba(0,0,0,.45); padding: 8px 16px; border-radius: 999px;
    font-size: 22px; letter-spacing: 1px; backdrop-filter: blur(4px);
  }
  #timer.warn { background: rgba(220,40,40,.75); animation: pulse .6s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  /* 右侧列整体左移，给右上角菜单按钮(44px)让出空间 */
  #hudRight { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; margin-right: 52px; }
  #zoom {
    background: rgba(0,0,0,.45); padding: 6px 14px; border-radius: 999px;
    font-size: 15px; backdrop-filter: blur(4px); transition: background .2s;
  }
  #zoom.near { background: rgba(46,160,120,.8); }
  #hint {
    background: rgba(0,0,0,.45); padding: 7px 14px; border-radius: 999px;
    font-size: 13px; text-align: right; backdrop-filter: blur(4px);
  }

  /* 提示眼镜轮廓图标 */
  #goalIcon {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.45); color: #fff; padding: 8px 18px; border-radius: 999px;
    font-size: 13px; z-index: 10; pointer-events: none; backdrop-filter: blur(4px);
    display: flex; align-items: center; gap: 8px;
  }

  /* 错误反馈红叉 */
  #wrongX {
    position: fixed; z-index: 20; pointer-events: none;
    font-size: 64px; color: #ff2d2d; font-weight: 900;
    text-shadow: 0 0 12px rgba(255,0,0,.8);
    opacity: 0; transform: scale(.4); transition: none;
  }
  #wrongX.show { animation: xpop .6s ease-out; }
  @keyframes xpop {
    0% { opacity: 0; transform: scale(.4) rotate(-15deg); }
    30% { opacity: 1; transform: scale(1.2) rotate(5deg); }
    60% { opacity: 1; transform: scale(1) rotate(0); }
    100% { opacity: 0; transform: scale(1); }
  }
  #flashRed {
    position: fixed; inset: 0; background: rgba(255,0,0,.25); z-index: 15;
    opacity: 0; pointer-events: none;
  }
  #flashRed.show { animation: flash .35s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* 覆盖面板：开始 / 结束 */
  .panel {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; color: #fff;
    background: radial-gradient(circle at 50% 35%, #2a2a4a 0%, #15152b 100%);
    padding: 24px; gap: 18px;
  }
  .panel.hidden { display: none; }
  .panel h1 { font-size: 30px; line-height: 1.3; }
  .panel p { font-size: 15px; line-height: 1.7; opacity: .85; max-width: 420px; }
  .panel .big { font-size: 46px; }
  .btn {
    margin-top: 6px; padding: 14px 42px; border: none; border-radius: 999px;
    background: linear-gradient(135deg, #ff9f43, #ff6b6b); color: #fff;
    font-size: 19px; font-weight: 700; cursor: pointer; pointer-events: auto;
    box-shadow: 0 6px 20px rgba(255,107,107,.45); transition: transform .12s;
  }
  .btn:active { transform: scale(.94); }
  .controls-tip {
    font-size: 13px; opacity: .7; line-height: 1.8; margin-top: 4px;
    background: rgba(255,255,255,.08); padding: 12px 20px; border-radius: 14px;
  }
  .emoji { font-size: 56px; }
  .btn.ghost {
    background: rgba(255,255,255,.12); box-shadow: none;
    font-size: 16px; padding: 12px 34px;
  }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* 关卡选择网格 */
  #levelGrid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    width: 100%; max-width: 360px; margin-top: 8px;
  }
  .level-card {
    aspect-ratio: 1; border-radius: 18px; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; color: #fff; font-weight: 700; pointer-events: auto;
    background: linear-gradient(135deg, #ff9f43, #ff6b6b);
    box-shadow: 0 5px 16px rgba(255,107,107,.4); transition: transform .12s;
  }
  .level-card:active { transform: scale(.93); }
  .level-card .num { font-size: 30px; }
  .level-card .name { font-size: 11px; opacity: .9; font-weight: 500; }
  .level-card.locked {
    background: rgba(255,255,255,.1); box-shadow: none; cursor: not-allowed;
    color: rgba(255,255,255,.45);
  }
  .level-card .star { font-size: 12px; color: #ffe08a; height: 14px; }

  /* 游戏内右上角菜单 */
  #menuBtn {
    position: fixed; top: 14px; right: 16px; z-index: 25;
    width: 44px; height: 44px; border-radius: 12px; border: none; cursor: pointer;
    background: rgba(0,0,0,.45); color: #fff; font-size: 22px; backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center; pointer-events: auto;
  }
  #menuBtn:active { transform: scale(.92); }
  #menuDrop {
    position: fixed; top: 64px; right: 16px; z-index: 26;
    background: rgba(28,28,48,.96); border-radius: 14px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); min-width: 164px;
    display: flex; flex-direction: column; backdrop-filter: blur(6px);
  }
  #menuDrop.hidden, #menuBtn.hidden { display: none; }
  #menuDrop button {
    background: none; border: none; color: #fff; font-size: 15px;
    padding: 14px 18px; text-align: left; cursor: pointer; pointer-events: auto;
    display: flex; align-items: center; gap: 10px;
  }
  #menuDrop button:active { background: rgba(255,255,255,.1); }
  #menuDrop button + button { border-top: 1px solid rgba(255,255,255,.08); }
  #menuMask {
    position: fixed; inset: 0; z-index: 24; background: transparent;
  }
  #menuMask.hidden { display: none; }
</style>
</head>
<body>
<div id="game">
  <canvas id="canvas"></canvas>
</div>

<div id="hud" class="hidden">
  <div id="timer">⏱ 45</div>
  <div id="hudRight">
    <div id="zoom">🔍 ×1.0</div>
    <div id="hint">滑动环顾 · 捏合/滚轮走近</div>
  </div>
</div>
<div id="goalIcon" class="hidden">看清可疑目标后，点击确认是不是眼镜</div>

<!-- 游戏内右上角菜单 -->
<button id="menuBtn" class="hidden" aria-label="菜单">☰</button>
<div id="menuMask" class="hidden"></div>
<div id="menuDrop" class="hidden">
  <button id="mResume">▶️ 继续游戏</button>
  <button id="mRetry">🔄 重玩本关</button>
  <button id="mLevels">🗂️ 选择关卡</button>
  <button id="mHome">🏠 返回主页</button>
</div>

<div id="wrongX">✕</div>
<div id="flashRed"></div>

<!-- 首页 -->
<div id="homePanel" class="panel">
  <div class="emoji">👓</div>
  <h1>我的眼镜在哪里？</h1>
  <p>你是个近视眼，眼镜又双叒不见了。<br>在凌乱的房间里，限时找到并戴上它！</p>
  <div class="btn-row">
    <button class="btn" id="homePlayBtn">开始游戏</button>
    <button class="btn ghost" id="homeLevelsBtn">选择关卡</button>
  </div>
  <div class="controls-tip" id="ctrlTip"></div>
</div>

<!-- 关卡选择页 -->
<div id="levelPanel" class="panel hidden">
  <h1 style="font-size:26px">选择关卡</h1>
  <div id="levelGrid"></div>
  <button class="btn ghost" id="levelBackBtn">返回主页</button>
</div>

<!-- 结束面板 -->
<div id="endPanel" class="panel hidden">
  <div class="emoji" id="endEmoji">🎉</div>
  <h1 id="endTitle">过关！</h1>
  <p id="endMsg"></p>
  <div class="btn-row">
    <button class="btn" id="nextBtn">下一关</button>
    <button class="btn" id="retryBtn">再玩一次</button>
    <button class="btn ghost" id="endLevelsBtn">选择关卡</button>
    <button class="btn ghost" id="endHomeBtn">返回主页</button>
  </div>
</div>

<!-- 按依赖顺序加载；main.js 最后执行 init() -->
<script src="src/config.js"></script>
<script src="src/camera.js"></script>
<script src="src/scene.js"></script>
<script src="src/render.js"></script>
<script src="src/input.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
